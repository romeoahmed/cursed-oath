name: build

on: [pull_request, push]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify model export
        run: |
          python3 -m unittest discover -s art/shrine
          python3 art/shrine/export.py --check

      - uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: microsoft

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and verify
        run: ./gradlew build

      - name: Install Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers

      - name: Run Vulkan client game tests
        timeout-minutes: 10
        env:
          SDL_VIDEO_DRIVER: x11
        run: xvfb-run -a ./gradlew runClientGameTest

      - name: Upload JARs
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/*.jar
          if-no-files-found: error
          compression-level: 0

      - name: Upload verification reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: Verification
          path: |
            build/reports/
            build/test-results/
            build/run/**/logs/
            build/run/**/crash-reports/
            build/run/**/screenshots/
